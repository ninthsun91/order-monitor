symbol: BTC/USDT

thresholds:
  size_threshold_btc: 1000       # D1/D5 인텐트 기준 (PRD v1.1 확정 — 벽 레지스트리 레벨에 적용)
  persist_seconds: 3             # D1 스푸핑 필터
  exit_ratio: 0.5
  fill_attribution: 0.7
  vol_floor_btc: 30              # D2 절대 하한 (PRD v1.3 — 기준선 붕괴 시 노이즈 방지)
  vol_multiplier: 10             # D2 상대 임계 배수 (THR = max(floor, multiplier × 분당 기준선))
  vol_baseline_hours: 24         # D2 기준선 창
  window_seconds: 60             # D2 온셋 창
  episode_exit_ratio: 0.5        # D2 에피소드 종료 히스테리시스
  episode_merge_minutes: 10      # D2 에피소드 병합 창 (잠정 종료 후 이 시간 내 재점화 = 같은 에피소드)
  delta_directional_ratio: 0.5   # D2 성격 라벨: |Δ|/V ≥ 이 값 → 방향성
  delta_balanced_ratio: 0.2      # D2 성격 라벨: |Δ|/V ≤ 이 값 → 양방향(흡수성 후보)
  summary_absorb_delta_min: 0.35 # D2 요약 판정: 흡수/관철 판정 대상 최소 델타비 (결정 기록 2026-07-13, M6 튜닝 대상)
  summary_move_min_pct: 0.1      # D2 요약 판정: 델타 방향 '관철'로 보는 최소 에피소드 변화율(%)
  absorption_min_pct: 0.3        # D3
  pierce_persist_snapshots: 2    # D3 관통 보조 신호 지속성 (PRD §8 D3 v1.2)
  refill_window_ms: 500          # D4 가시 리필 체결→회복 페어링 창 (PRD v1.2 유지)
  absorb_multiple: 2.0           # D4 첫 발화 배수 M — absorbed ≥ M × 기준크기 R (PRD v1.11, 잠정 — M6 튜닝)
  absorb_progress_step: 0.5      # D4 진행 발화 간격, ×R 단위 (PRD v1.11)
  absorb_min_events: 5           # D4 흡수 인정 이벤트 최소 수 (PRD v1.11 — 구 iceberg_min_trades 계승)
  realize_pct: 0.6               # D5
  progress_step_pct: 0.2         # D5 진행률 알림 경계 (PRD v1.2). on/off는 alerts.send_d5_progress
                                 # (PRD v1.5) intent_ttl_seconds 삭제 — 인텐트 수명 = 벽 수명 (TTL 폐지)

alerts:
  send_d1: true
  send_d2: true                  # D2 에피소드 온셋 (PRD v1.3)
  send_d2_summary: true          # D2 에피소드 요약 (PRD v1.3)
  send_d4: true                  # D4 흡수 방어 알림 (PRD v1.11)
  send_d5_progress: true         # D5 진행률 알림 (PRD v1.2)
  send_wall_report: true         # 물량벽 정기 리포트 (DEVELOPMENT_PLAN 결정 기록 참고)
  wall_report_interval_minutes: 60
  bucket_size_usdt: 50
  cooldown_seconds: 300

wall_tracker:                    # PRD v1.1 — diff 탭 벽 레지스트리
  record_min_qty_btc: 100        # 레지스트리 "기록" 하한 (알림 아님 — 관측·튜닝 데이터용, 알림은 size_threshold_btc)
  ttl_days: 7                    # unconfirmed 마킹 후 이 기간 재확인 이벤트 없으면 삭제 (PRD §12.1 v1.2 — 확인된 벽은 무기한 유지)

telegram:
  chat_id: "..."                 # 토큰은 TELEGRAM_BOT_TOKEN env로

watchdog:
  stale_seconds: 30              # depth·diff 스트림 staleness 임계 (PRD §5.4 v1.2 — 스트림별 감시)
  trade_stale_seconds: 60        # aggTrade staleness 임계 (체결 발생 시에만 push라 별도 임계)
  heartbeat_interval: 10
