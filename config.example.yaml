exchange: binance
symbol: BTC/USDT
depth_stream: depth20@100ms

thresholds:
  size_threshold_btc: 1000       # D1/D5 인텐트 기준 (PRD v1.1 확정 — 벽 레지스트리 레벨에 적용)
  persist_seconds: 3             # D1 스푸핑 필터
  exit_ratio: 0.5
  fill_attribution: 0.7
  vol_threshold_btc: 100         # D2
  window_seconds: 60             # D2
  burst_cooldown_seconds: 120
  absorption_min_pct: 0.3        # D3
  iceberg_margin_btc: 20         # D4
  iceberg_min_trades: 5
  realize_pct: 0.6               # D5
  realize_pct_above: 0.6
  intent_ttl_seconds: 1800
  progress_step_pct: 0.2         # D5 진행률 알림 경계 (PRD v1.2). on/off는 alerts.send_d5_progress

alerts:
  send_d1: false
  send_d2: true
  send_d5_progress: true         # D5 진행률 알림 (PRD v1.2)
  bucket_size_usdt: 50
  cooldown_seconds: 300

wall_tracker:                    # PRD v1.1 — diff 탭 벽 레지스트리
  record_min_qty_btc: 100        # 레지스트리 "기록" 하한 (알림 아님 — 관측·튜닝 데이터용, 알림은 size_threshold_btc)
  ttl_days: 14                   # 이 기간 동안 해당 가격에 이벤트 없으면 레지스트리에서 삭제

telegram:
  chat_id: "..."                 # 토큰은 TELEGRAM_BOT_TOKEN env로

watchdog:
  stale_seconds: 30              # 이 시간 동안 depth 이벤트 없으면 FEED_STALE
  heartbeat_interval: 10
