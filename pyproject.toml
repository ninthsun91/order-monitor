[project]
name = "order-monitor"
version = "0.1.0"
description = "BTC 오더북 인텐트→실체결 모니터"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[project.scripts]
order-monitor = "order_monitor.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/order_monitor"]
